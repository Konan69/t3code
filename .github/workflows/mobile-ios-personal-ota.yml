name: Mobile iOS Personal OTA

on:
  workflow_dispatch:
  push:
    branches: [local/cloudbox]

permissions:
  contents: read

concurrency:
  group: mobile-ios-personal-ota-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VARIANT: development
  EXPO_NO_GIT_STATUS: "1"
  MOBILE_VERSION_POLICY: fingerprint
  NODE_OPTIONS: --max-old-space-size=8192
  T3CODE_CLERK_JWT_TEMPLATE: t3-relay
  T3CODE_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsudDMuY29kZXMk
  T3CODE_IOS_PERSONAL_TEAM: "1"
  T3CODE_IOS_PERSONAL_TEAM_BUNDLE_ID: com.myproxi.t3code.dev
  T3CODE_MOBILE_UPDATE_CHANNEL: cloudbox-personal
  T3CODE_RELAY_URL: https://relay.t3.codes

jobs:
  update:
    name: Publish fingerprint-gated personal update
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - id: expo-token
        name: Check for EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "EXPO_TOKEN is not available; skipping the personal OTA publish."
          fi

      - name: Checkout
        if: steps.expo-token.outputs.present == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Vite+
        if: steps.expo-token.outputs.present == 'true'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - name: Setup EAS
        if: steps.expo-token.outputs.present == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Publish iOS update
        if: steps.expo-token.outputs.present == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          message="$(git log -1 --pretty=%s | head -c 120) ($(git rev-parse --short=9 HEAD))"
          eas update \
            --channel "$T3CODE_MOBILE_UPDATE_CHANNEL" \
            --environment development \
            --platform ios \
            --message "$message" \
            --non-interactive
