name: Mobile iOS Sideload

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ios-sideload-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VARIANT: development
  EXPO_NO_GIT_STATUS: "1"
  MOBILE_VERSION_POLICY: fingerprint
  NODE_OPTIONS: --max-old-space-size=8192
  T3CODE_CLERK_JWT_TEMPLATE: t3-relay
  T3CODE_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsudDMuY29kZXMk
  T3CODE_IOS_PERSONAL_TEAM: "1"
  T3CODE_IOS_PERSONAL_TEAM_BUNDLE_ID: com.myproxi.t3code.dev
  T3CODE_RELAY_URL: https://relay.t3.codes

jobs:
  ipa:
    name: Build unsigned IPA for personal signing
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - name: Expose pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Generate reduced-capability iOS project
        working-directory: apps/mobile
        run: npx expo prebuild --clean --platform ios --no-install

      - name: Install CocoaPods dependencies
        working-directory: apps/mobile/ios
        run: pod install

      - name: Build unsigned device app
        working-directory: apps/mobile
        run: |
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [ -z "$workspace" ]; then
            echo "No generated Xcode workspace found." >&2
            exit 1
          fi

          scheme="$(xcodebuild -workspace "$workspace" -list -json | jq -r '.workspace.schemes[0]')"
          if [ -z "$scheme" ] || [ "$scheme" = null ]; then
            echo "No shared Xcode scheme found." >&2
            exit 1
          fi

          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/t3-ios-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            build

      - name: Package IPA
        run: |
          app="$(find "$RUNNER_TEMP/t3-ios-derived-data/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$app" ]; then
            echo "No built iOS app found." >&2
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/t3-ios-ipa/Payload"
          ditto "$app" "$RUNNER_TEMP/t3-ios-ipa/Payload/$(basename "$app")"
          (
            cd "$RUNNER_TEMP/t3-ios-ipa"
            zip -qry "$GITHUB_WORKSPACE/T3-Code-personal.ipa" Payload
          )
          unzip -t "$GITHUB_WORKSPACE/T3-Code-personal.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: T3-Code-personal-unsigned-ipa
          path: T3-Code-personal.ipa
          if-no-files-found: error
          retention-days: 14
